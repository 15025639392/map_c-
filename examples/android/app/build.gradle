plugins { id "com.android.application" }

android {
    namespace "com.mapcplus.terrain"
    compileSdk 36
    ndkVersion System.getenv("ANDROID_NDK_VERSION") ?: "28.2.13676358"
    defaultConfig {
        applicationId "com.mapcplus.terrain"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }
    buildTypes {
        debug { }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
